services:
  db: 
      image: postgres:16
      restart: always
      environment:
        POSTGRES_PASSWORD: admin
        POSTGRES_DB: aseos_db
        POSTGRES_USER: admin
      ports:
        - "5432:5432"
      volumes:
        - ./backend/sql/init.sql:/docker-entrypoint-initdb.d
        - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: